    <script>
      (function() {
        // Ensure window.fetch has both a getter and a setter so that extensions
        // attempting direct assignment (window.fetch = ...) do not throw TypeError in strict mode.
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if already configured or unconfigurable
        }

        // Filter out unhandled extension runtime errors from crashing preview
        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
